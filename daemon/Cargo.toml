[package]
name = "snip"
version = "0.1.0"
edition = "2021"
description = "Capture the selected text on double Shift and store each capture as a Markdown file"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
evdev = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
